[workspace]

[package]
name = "stateless-validator-reth-zisk"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
    "native-keccak",
] }

# ere
# NOTE: Using `default-features = false, features = ["inputcpy"]` mainly to disable the other
#       feature enabled by default `user-hints`, which this binary doesn't use but introduces lots
#       of dependencies.
ere-platform-zisk = { git = "https://github.com/eth-act/ere", tag = "v0.19.5", default-features = false, features = [
    "inputcpy",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", default-features = false, features = [
    "zkvm-interface",
] }

[profile.release]
codegen-units = 1
lto = "fat"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zisk_hints)',
    'cfg(zisk_hints_debug)',
    'cfg(target_vendor, values("zisk"))',
] }

# Mirrors the reth-core patches in the root workspace, which do not apply to this workspace.
[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
