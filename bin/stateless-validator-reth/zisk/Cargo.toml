[workspace]

[package]
name = "stateless-validator-reth-zisk"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
    "native-keccak",
] }

# ere
# NOTE: Using `default-features = false, features = ["inputcpy"]` mainly to disable the other
#       feature enabled by default `user-hints`, which this binary doesn't use but introduces lots
#       of dependencies.
ere-platform-zisk = { git = "https://github.com/eth-act/ere", rev = "552595938b48884d87cfada24f29d39223695c1e", default-features = false, features = [
    "inputcpy",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", default-features = false, features = [
    "zisk",
] }

# Temporary until the revm release containing bluealloy/revm#3855 is published.
[patch.crates-io]
revm = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-context = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-context-interface = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-database = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-database-interface = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-handler = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-inspector = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-interpreter = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-precompile = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-primitives = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }
revm-state = { git = "https://github.com/bluealloy/revm", rev = "8382708f04bdb7b2052729eb1ec3492712bb3203" }

[features]
cycle-scope = ["ere-platform-zisk/cycle-scope"]

[profile.release]
codegen-units = 1
lto = "fat"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(zisk_hints)',
    'cfg(zisk_hints_debug)',
    'cfg(target_vendor, values("zisk"))',
] }
