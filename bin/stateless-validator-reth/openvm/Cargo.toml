[workspace]

[package]
name = "stateless-validator-reth-openvm"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-hashbrown",
    "native-keccak",
] }

# ere
ere-platform-openvm = { git = "https://github.com/eth-act/ere", tag = "v0.17.0", features = [
    "std",
    "zkvm-accelerator",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", features = [
    "zkvm-interface",
] }

[profile.release]
codegen-units = 1
lto = "fat"
