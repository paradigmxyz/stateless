[workspace]

[package]
name = "stateless-validator-reth-openvm"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-hashbrown",
    "native-keccak",
] }

# ere
ere-platform-openvm = { git = "https://github.com/eth-act/ere", rev = "552595938b48884d87cfada24f29d39223695c1e", features = [
    "std",
    "zkvm-accelerator",
] }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", features = [
    "openvm",
] }

# Temporary until the revm release containing bluealloy/revm#3855 and #3856 is published.
[patch.crates-io]
revm = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-context = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-context-interface = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-database = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-database-interface = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-handler = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-inspector = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-interpreter = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-precompile = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-primitives = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }
revm-state = { git = "https://github.com/bluealloy/revm", rev = "27d65aa97fa3bae7500847da5bfdb4b89e1ba1bf" }

[profile.release]
codegen-units = 1
lto = "fat"
