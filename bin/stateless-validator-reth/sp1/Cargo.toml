[workspace]

[package]
name = "stateless-validator-reth-sp1"
version = "0.1.0"
edition = "2024"

[dependencies]
# enable features
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
    "native-keccak",
] }

# ere
ere-platform-sp1 = { git = "https://github.com/eth-act/ere", tag = "v0.19.5" }

# local
stateless-validator-reth = { path = "../../../crates/stateless-validator-reth", default-features = false, features = [
    "sp1",
] }

[profile.release]
codegen-units = 1
lto = "fat"
