name: Reth guest artifacts

on:
  push:
    tags:
      - "reth-guest-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build Reth guest (${{ matrix.zkvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        zkvm:
          - openvm
          - sp1
          - zisk
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        if: matrix.zkvm == 'zisk'
        run: .github/scripts/free-up-disk-space.sh

      - name: Build ELF and verification key
        run: scripts/guests/build.sh "${{ matrix.zkvm }}" output

      - name: Upload guest artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reth-guest-${{ matrix.zkvm }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Execute Reth guest (${{ matrix.zkvm }})
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        zkvm:
          - openvm
          - sp1
          - zisk
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        run: .github/scripts/free-up-disk-space.sh

      - name: Download guest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reth-guest-${{ matrix.zkvm }}
          path: output

      - name: Execute built guest
        run: scripts/guests/smoke-test.sh "${{ matrix.zkvm }}" output

  release:
    name: Publish signed guest release
    if: startsWith(github.ref, 'refs/tags/reth-guest-v')
    needs:
      - build
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download guest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reth-guest-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum -- *.elf *.vk > SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: |
            release/*.elf
            release/*.vk
            release/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Reth stateless validator $GITHUB_REF_NAME"
