name: Reth guest artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build Reth guest (${{ matrix.zkvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        zkvm:
          - openvm
          - sp1
          - zisk
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        if: matrix.zkvm == 'zisk'
        run: .github/scripts/free-up-disk-space.sh

      - name: Build ELF and verification key
        run: scripts/guests/build.sh "${{ matrix.zkvm }}" output

      - name: Verify locked dependencies
        run: git diff --exit-code -- "bin/stateless-validator-reth/${{ matrix.zkvm }}/Cargo.lock"

      - name: Execute built guest
        run: scripts/guests/smoke-test.sh "${{ matrix.zkvm }}" output

      - name: Upload guest artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reth-guest-${{ matrix.zkvm }}
          path: output/*
          if-no-files-found: error
          retention-days: 14

  package:
    name: Assemble guest release
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download guest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: reth-guest-*
          path: release
          merge-multiple: true

      - name: Create manifest and checksums
        run: |
          rm release/SHA256SUMS-*
          scripts/guests/create-release-manifest.sh release
          cd release
          sha256sum -- *.elf *.vk RELEASE-MANIFEST.json > SHA256SUMS

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reth-guest-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish signed guest release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download guest artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: reth-guest-release
          path: release

      - name: Attest release artifacts
        id: attest
        uses: actions/attest@c32b4b8b198b65d0bd9d63490e847ff7b53989d4 # v4.0.0
        with:
          subject-path: |
            release/*.elf
            release/*.vk
            release/RELEASE-MANIFEST.json
            release/SHA256SUMS

      - name: Include offline provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" release/provenance.intoto.jsonl

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Reth stateless validator $GITHUB_REF_NAME"
