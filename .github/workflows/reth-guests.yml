name: Guest dependency gate evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lockfile:
    name: Read-only lockfile (${{ matrix.zkvm }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        zkvm: [openvm, sp1, zisk]
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Free disk space
        if: matrix.zkvm == 'zisk'
        run: .github/scripts/free-up-disk-space.sh
      - name: Install Rust
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e8f9d5c23ab43d0645c6d50fb73e98b362cdec02
        with:
          toolchain: stable
      - name: Exercise pinned compiler with stale read-only lockfile
        run: bash .github/tests/guest-gates.sh lockfile '${{ matrix.zkvm }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lockfile-${{ matrix.zkvm }}
          path: evidence/
          retention-days: 14
  cooldown:
    name: Aegis cooldown stops build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@48ff2b0c97ede86c9f10d105424380b9605f790d
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@e8f9d5c23ab43d0645c6d50fb73e98b362cdec02
        with:
          toolchain: stable
      - name: Positive control then real cooldown rejection
        run: bash .github/tests/guest-gates.sh cooldown
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cooldown-gate
          path: evidence/
          retention-days: 14
