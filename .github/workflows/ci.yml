name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBZ_SYS_STATIC: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ef-tests:
    name: Ethereum Foundation tests (${{ matrix.trie }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - trie: default
            allow_failure: false
          - trie: zeth
            allow_failure: true
    env:
      RUST_LOG: info,sync=error
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: stable
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Run EF tests
        run: ./scripts/run_ef_tests.sh ${{ matrix.trie }}

  no-std:
    name: no_std (RISC-V rv64im)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Build stateless for riscv64im
        run: ./scripts/check_no_std.sh

  stateless-validator:
    name: Reth stateless validator fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_LOG: info
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@1c0547fbe5b79d7fc4a011e87ef4ac71cf485093
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Run execution-spec fixtures
        run: cargo test -p stateless-validator-tests --test host_execution
