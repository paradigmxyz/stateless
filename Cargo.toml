[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/paradigmxyz/stateless"
repository = "https://github.com/paradigmxyz/stateless"
exclude = [".github/"]

[workspace]
members = [
    "crates/stateless",
    "crates/tries",
    "crates/zeth-mpt",
    "testing/ef-tests",
]
resolver = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.lints.rustdoc]
all = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"

[workspace.dependencies]
# internal
stateless = { path = "crates/stateless" }
tries = { path = "crates/tries" }

# reth
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-db = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-provider = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3" }
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", branch = "bal-devnet-3", default-features = false }

# alloy
alloy-consensus = { version = "1.7", default-features = false }
alloy-eips = { version = "1.7", default-features = false }
alloy-genesis = { version = "1.7", default-features = false }
alloy-primitives = { version = "1.5", default-features = false, features = ["map-indexmap"] }
alloy-rlp = { version = "0.3", default-features = false }
alloy-rpc-types-debug = { version = "1.7", default-features = false }
alloy-trie = { version = "0.9", default-features = false }

# revm
revm = { version = "36.0.0", default-features = false }
revm-bytecode = { version = "9.0.0", default-features = false }
revm-database-interface = { version = "10.0.0", default-features = false }
revm-state = { version = "10.0.0", default-features = false }

# misc
arrayvec = { version = "0.7", default-features = false }
bincode = "1.3"
itertools = { version = "0.14", default-features = false, features = [
    "use_alloc",
] }
rayon = "1.8"
rkyv = "0.8"
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = "1.0"
serde_with = { version = "3.16", default-features = false, features = [
    "alloc",
] }
clap = "4"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
tar = "0.4"
tempfile = "3"
thiserror = { version = "2.0", default-features = false }
walkdir = "2.5"

[patch.crates-io]
# revm patches (same rev as reth bal-devnet-3)
revm = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-bytecode = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-database = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-database-interface = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-state = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-primitives = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-interpreter = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-precompile = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-context = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-context-interface = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-handler = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }
revm-inspector = { git = "https://github.com/bluealloy/revm", rev = "30e1c40" }

# alloy patches (BAL/Glamsterdam header extensions)
alloy-evm = { git = "https://github.com/alloy-rs/evm", branch = "bal-devnet3" }
alloy-consensus = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-consensus-any = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-eips = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-genesis = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-network = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-network-primitives = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-rpc-types-debug = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-rpc-types-engine = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-rpc-types-eth = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-serde = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
alloy-signer = { git = "https://github.com/alloy-rs/alloy", branch = "bal-devnet2" }
