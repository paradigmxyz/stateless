[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paradigmxyz/stateless"
exclude = [".github/"]

[workspace]
members = [
    "crates/stateless",
    "crates/stateless-validator-common",
    "crates/stateless-validator-reth",
    "crates/tries",
    "crates/zeth-mpt",
    "testing/ef-tests",
    "testing/stateless-validator",
]
resolver = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("zisk"))'] }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.lints.rustdoc]
all = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"

[workspace.dependencies]
# internal
stateless = { path = "crates/stateless", default-features = false }
stateless-validator-common = { path = "crates/stateless-validator-common", default-features = false }
stateless-validator-reth = { path = "crates/stateless-validator-reth", default-features = false }
tries = { path = "crates/tries", default-features = false }

# reth
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-db = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80" }
reth-db-api = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80" }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-primitives-traits = { version = "0.8.2", default-features = false }
reth-payload-validator = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-provider = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80" }
reth-trie-sparse = { git = "https://github.com/paradigmxyz/reth", rev = "c9a780f4f23d6752ca299b104c93b7f099673c80", default-features = false }

# alloy
alloy-consensus = { version = "2.5.0", default-features = false }
alloy-eips = { version = "2.5.0", default-features = false }
alloy-genesis = { version = "2.5.0", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false, features = ["map-foldhash", "map-indexmap"] }
alloy-rlp = { version = "0.3.16", default-features = false }
alloy-rpc-types-debug = { version = "2.5.0", default-features = false }
alloy-rpc-types-engine = { version = "2.5.0", default-features = false }
alloy-trie = { version = "0.9.8", default-features = false }

# evm2
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "f93318f120f6300599b21170d6c7bef81ed63d87", default-features = false }

# zkVM standard
zkvm-interface = { git = "https://github.com/eth-act/zkvm-standards", rev = "282cd356c3a0498416bb0619f9c8a347ce9933fb" }

# Ere
ere-platform-core = { git = "https://github.com/eth-act/ere", tag = "v0.19.5" }
ere-server-client = { git = "https://github.com/eth-act/ere", tag = "v0.19.5" }
ere-util-tokio = { git = "https://github.com/eth-act/ere", tag = "v0.19.5" }

# ssz
libssz = { version = "0.3.0", default-features = false, features = ["alloc"] }
libssz-derive = "0.3.0"
libssz-merkle = { version = "0.3.0", default-features = false, features = [
    "alloc",
    "sha2-backend",
] }
libssz-types = { version = "0.3.0", default-features = false, features = ["alloc"] }

# misc
anyhow = "1.0"
arrayvec = { version = "0.7", default-features = false }
bincode = "1.3"
const-hex = { version = "1.19", default-features = false, features = ["alloc"] }
flate2 = "1.1"
itertools = { version = "0.14", default-features = false, features = [
    "use_alloc",
] }
paste = "1.0"
rayon = "1.8"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
rkyv = "0.8"
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = "1.0"
serde_with = { version = "3.16", default-features = false, features = [
    "alloc",
] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
thiserror = { version = "2.0", default-features = false }
walkdir = "2.5"

# reth v2.9.0 depends on unreleased reth-core crates. Cargo does not apply a dependency's patches,
# so these mirror the patches in reth's workspace.
[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
