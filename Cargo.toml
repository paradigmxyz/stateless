[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/paradigmxyz/stateless"
repository = "https://github.com/paradigmxyz/stateless"
exclude = [".github/"]

[workspace]
members = [
    "crates/stateless",
    "crates/stateless-validator-common",
    "crates/stateless-validator-reth",
    "crates/tries",
    "crates/zeth-mpt",
    "testing/ef-tests",
    "testing/stateless-validator",
]
resolver = "2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
disallowed_types = "deny"

[workspace.lints.rustdoc]
all = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"

[workspace.dependencies]
# internal
stateless = { path = "crates/stateless", default-features = false }
stateless-validator-common = { path = "crates/stateless-validator-common", default-features = false }
stateless-validator-reth = { path = "crates/stateless-validator-reth", default-features = false }
tries = { path = "crates/tries", default-features = false }

# reth
reth-chainspec = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-consensus = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-db = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b" }
reth-db-api = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b" }
reth-db-common = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b" }
reth-ethereum-consensus = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-evm = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-evm-ethereum = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-primitives-traits = { version = "0.5.2", default-features = false }
reth-payload-validator = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-provider = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b" }
reth-revm = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-tracing = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b" }
reth-trie = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b" }
reth-trie-common = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }
reth-trie-db = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b" }
reth-trie-sparse = { git = "https://github.com/han0110/reth", rev = "c5dff62a8804b207659f5d1f30f13e66c3a66d4b", default-features = false }

# alloy
alloy-consensus = { version = "2.1.1", default-features = false }
alloy-eips = { version = "2.1.1", default-features = false }
alloy-genesis = { version = "2.1.1", default-features = false }
alloy-primitives = { version = "1.6.0", default-features = false, features = ["map-foldhash", "map-indexmap"] }
alloy-rlp = { version = "0.3.13", default-features = false }
alloy-rpc-types-debug = { version = "2.1.1", default-features = false }
alloy-rpc-types-engine = { version = "2.1.1", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false }

# revm
revm = { version = "41.0.0", default-features = false }
revm-bytecode = { version = "41.0.0", default-features = false }
revm-database-interface = { version = "41.0.0", default-features = false }
revm-state = { version = "41.0.0", default-features = false }

# zkVM standard
zkvm-interface = { git = "https://github.com/eth-act/zkvm-standards", rev = "282cd356c3a0498416bb0619f9c8a347ce9933fb" }

# OpenVM
openvm-sha2 = { git = "https://github.com/openvm-org/openvm.git", tag = "v2.0.0" }

# Ere
ere-platform-core = { git = "https://github.com/eth-act/ere", tag = "v0.14.0" }

# ssz
libssz = { version = "0.2.2", default-features = false, features = ["alloc"] }
libssz-derive = "0.2.2"
libssz-merkle = { version = "0.2.2", default-features = false, features = [
    "alloc",
    "sha2-backend",
] }
libssz-types = { version = "0.2.2", default-features = false, features = ["alloc"] }

# misc
anyhow = "1.0"
arrayvec = { version = "0.7", default-features = false }
bincode = "1.3"
const-hex = { version = "1.19", default-features = false, features = ["alloc"] }
flate2 = "1.1"
itertools = { version = "0.14", default-features = false, features = [
    "use_alloc",
] }
paste = "1.0"
rayon = "1.8"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
rkyv = "0.8"
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = "1.0"
serde_with = { version = "3.16", default-features = false, features = [
    "alloc",
] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
thiserror = { version = "2.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
zstd = "0.13"

